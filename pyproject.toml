[project]
name = "zotero-local-mcp"
version = "0.2.0"
description = "Zotero 10 librarian and research assistant MCP servers (local API, PubMed, OpenAlex, Crossref)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Tiago Jacinto" }]
dependencies = [
    "mcp>=2.2,<3",
    "httpx>=0.27",
    "markdown>=3.6",
]

[project.scripts]
zotero-local-mcp = "zotero_local_mcp.server:main"
zotero-scholar-mcp = "zotero_local_mcp.scholar_server:main"
zotero-alerts = "zotero_local_mcp.alerts:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zotero_local_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
