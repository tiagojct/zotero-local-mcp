[project]
name = "zotero-local-mcp"
version = "0.1.0"
description = "MCP server for a local Zotero 10 library: faceted tagging, citekeys and safe edits through the local API"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Tiago Jacinto" }]
dependencies = [
    "mcp>=2.2,<3",
    "httpx>=0.27",
    "markdown>=3.6",
]

[project.scripts]
zotero-local-mcp = "zotero_local_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zotero_local_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
