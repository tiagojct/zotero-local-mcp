[project]
name = "zotero-local-mcp"
version = "0.5.0"
description = "Zotero 10 librarian and research assistant MCP servers (local API, PubMed, OpenAlex, Crossref)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Tiago Jacinto" }]
keywords = ["zotero", "mcp", "librarian", "research", "pubmed", "openalex", "tagging"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "mcp>=2.2,<3",
    "httpx>=0.27",
    "markdown>=3.6",
]

[project.urls]
Homepage = "https://subsub.tiagojacinto.eu"
Repository = "https://github.com/tiagojct/zotero-local-mcp"
Issues = "https://github.com/tiagojct/zotero-local-mcp/issues"

[project.scripts]
zotero-local-mcp = "zotero_local_mcp.server:main"
zotero-scholar-mcp = "zotero_local_mcp.scholar_server:main"
zotero-alerts = "zotero_local_mcp.alerts:main"
zotero-bakeoff = "zotero_local_mcp.bakeoff:main"
zotero-bench = "zotero_local_mcp.bench:main"
zotero-review = "zotero_local_mcp.review:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zotero_local_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
